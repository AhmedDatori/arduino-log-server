<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arduino Log Viewer</title>
  <style>
    /* ── Reset & base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f1a;
      --surface:   #111827;
      --surface2:  #1a2235;
      --border:    #1f2d45;
      --accent:    #3b82f6;
      --accent2:   #06b6d4;
      --green:     #22c55e;
      --red:       #ef4444;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --dim:       #334155;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    /* ── Top bar ─────────────────────────────────────────────────── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .logo span { color: var(--accent2); }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .pill-live {
      background: rgba(34,197,94,.12);
      color: var(--green);
      border: 1px solid rgba(34,197,94,.25);
    }

    .pulse {
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* ── Buttons ─────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 7px;
      border: 1px solid transparent;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: #2563eb; }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--dim); background: var(--surface2); }

    .btn-danger {
      background: transparent;
      color: #f87171;
      border-color: rgba(239,68,68,.3);
    }
    .btn-danger:hover { background: rgba(239,68,68,.1); }

    /* ── Main content ────────────────────────────────────────────── */
    .main {
      padding: 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Stats row ───────────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .stat-value.accent  { color: var(--accent2); }
    .stat-value.green   { color: var(--green); }

    /* ── Toolbar ─────────────────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    #status-text {
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Log list ────────────────────────────────────────────────── */
    #log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .entry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 0 12px;
      align-items: start;
      transition: border-color .15s;
      animation: slideIn .2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .entry:hover { border-color: var(--dim); }

    .entry-num {
      color: var(--dim);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      padding-top: 2px;
      user-select: none;
    }

    .entry-msg {
      font-size: 13.5px;
      color: var(--text);
      word-break: break-all;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11.5px;
      color: var(--muted);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .tag-device { color: #7dd3fc; }
    .tag-ip     { color: #86efac; }
    .tag-time   { color: var(--muted); }

    .entry-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(59,130,246,.12);
      color: #7dd3fc;
      border: 1px solid rgba(59,130,246,.2);
      white-space: nowrap;
      margin-top: 2px;
    }

    /* ── Empty state ─────────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--dim);
    }

    .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: .4; }
    .empty-title { font-size: 1rem; font-weight: 600; color: var(--muted); margin-bottom: 0.4rem; }
    .empty-sub   { font-size: 12px; color: var(--dim); }

    /* ── Spinner ─────────────────────────────────────────────────── */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    .spinner.active { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ───────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      transform: translateY(8px);
      transition: all .25s;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── Scrollbar ───────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<div class="layout">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">📡 Arduino <span>Logs</span></span>
      <span class="pill pill-live">
        <span class="pulse"></span>
        LIVE
      </span>
    </div>
    <div class="topbar-right">
      <div class="spinner" id="spinner"></div>
      <span id="status-text">Loading…</span>
      <button class="btn btn-ghost" onclick="load()">↻ Refresh</button>
      <button class="btn btn-danger" onclick="clearLogs()">🗑 Clear</button>
    </div>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Logs</div>
        <div class="stat-value accent" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Last Seen</div>
        <div class="stat-value" style="font-size:1rem; padding-top:4px" id="stat-last">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Device</div>
        <div class="stat-value green" style="font-size:1rem; padding-top:4px" id="stat-device">—</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="section-title">Recent Entries</span>
      </div>
    </div>

    <!-- Log entries -->
    <div id="log-list"></div>

  </main>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  let lastCount = -1;

  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function timeAgo(iso) {
    const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (diff <  60)  return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400)return Math.floor(diff / 3600) + 'h ago';
    return new Date(iso).toLocaleDateString();
  }

  function fullDate(iso) {
    try { return new Date(iso).toLocaleString(); } catch { return iso; }
  }

  function showToast(msg, duration = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  async function load() {
    document.getElementById('spinner').classList.add('active');
    try {
      const res  = await fetch('/api/logs');
      const logs = await res.json();

      document.getElementById('stat-total').textContent  = logs.length;
      document.getElementById('stat-last').textContent   = logs[0] ? timeAgo(logs[0].created_at) : '—';
      document.getElementById('stat-device').textContent = logs[0]?.device ?? '—';
      document.getElementById('status-text').textContent = 'Updated ' + new Date().toLocaleTimeString();

      if (logs.length === lastCount) return;
      lastCount = logs.length;

      const list = document.getElementById('log-list');

      if (!logs.length) {
        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">📭</div>
            <div class="empty-title">No logs yet</div>
            <div class="empty-sub">Waiting for the Arduino to send its first message…</div>
          </div>`;
        return;
      }

      list.innerHTML = logs.map((l, i) => `
        <div class="entry">
          <div class="entry-num">${i + 1}</div>
          <div>
            <div class="entry-msg">${esc(l.message)}</div>
            <div class="entry-meta">
              <span class="tag tag-device">📟 ${esc(l.device)}</span>
              <span class="tag tag-ip">🌐 ${esc(l.ip_address)}</span>
              <span class="tag tag-time" title="${fullDate(l.created_at)}">🕐 ${timeAgo(l.created_at)}</span>
            </div>
          </div>
          <div class="entry-badge">${fullDate(l.created_at)}</div>
        </div>
      `).join('');

    } catch (e) {
      document.getElementById('status-text').textContent = '⚠ connection error';
    } finally {
      document.getElementById('spinner').classList.remove('active');
    }
  }

  async function clearLogs() {
    if (!confirm('Delete all logs? This cannot be undone.')) return;
    await fetch('/api/logs', { method: 'DELETE' });
    lastCount = -1;
    showToast('✓ All logs cleared');
    load();
  }

  load();
  setInterval(load, 5000);
</script>
</body>
</html>
